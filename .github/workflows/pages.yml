# ふところ町を GitHub Pages に配置する。
# 既定のブランチ（Settings → General → Default branch。名前は main でなくてよい）への push で、
# 単体テストに通ったら app/ フォルダーだけを公開する。ほかのブランチではテストだけ行う。
# （テストやドキュメントは公開しない。本人の入力データはリポジトリにも公開物にも含まれない）
name: Deploy to GitHub Pages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: npm test

  deploy:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: test
    runs-on: ubuntu-latest
    # ジョブで permissions を書くと全体の設定は引き継がれないので、取り出し用の contents: read もここに書く
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
